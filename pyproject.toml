[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-router"
version = "0.1.0"
description = "Policy-driven execution routing for cost-efficient AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-router = "agent_router.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
catalog = ["PyYAML>=6.0"]
providers = [
  "openai>=1.0",
  "anthropic>=0.40",
]
all = [
  "openai>=1.0",
  "anthropic>=0.40",
  "PyYAML>=6.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_router"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
