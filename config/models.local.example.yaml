# ILLUSTRATIVE EXAMPLE -- a tiered catalog mixing a free local runtime with paid cloud
# models. Copy it to config/models.yaml and replace every value with reviewed ones before
# using it for anything real. Nothing here is a measurement.
#
# The point of this file is one non-obvious property:
#
#   A zero-priced model is ALWAYS the cheapest eligible candidate, so cost ranking can
#   never gate it. Only context_window, reliability, and capabilities can.
#
# Get those three wrong and the router sends every task to a 4B model. Get them right and
# you get a ladder: free local for small low-stakes work, cheap cloud when the prompt is
# too big or the floor too high, strong cloud for high-reliability work.
#
# The `local` provider speaks the OpenAI chat-completions API, so it works with LiteRT-LM,
# Ollama, llama.cpp, vLLM, or LM Studio. Point it somewhere with
# AGENT_ROUTER_LOCAL_BASE_URL (default http://127.0.0.1:9379/v1, which is LiteRT-LM's).
version: "2026-08-23"
pricing_as_of: "2026-08-23"
pricing_source: "ILLUSTRATIVE -- replace with an authoritative dated source"
metadata:
  owner: "example"
  reliability_review: "UNREVIEWED -- every reliability value here is invented"

aliases:
  local: qwen3-4b-instruct
  fast: cloud-flash-lite
  strong: cloud-flash

models:
  # Tier 1 -- free, private, on-device.
  #
  # context_window is the SINGLE most important field here, and it is not the model's
  # native context. LiteRT-LM 0.14.0 runs at a fixed max_num_tokens=4096 regardless of
  # what the model card claims, and a prompt past its practical ceiling breaks the HTTP
  # response instead of returning an error status. Setting the window to the real serving
  # limit makes the router refuse oversized work here and fall through to tier 2 --
  # turning an ugly failure mode into an ordinary routing rule.
  #
  # Measure your own ceiling; it is model- and content-dependent.
  - name: qwen3-4b-instruct
    provider: local
    execution_classes:
      - light_reasoning
    capabilities:
      - semantic_reasoning
    context_window: 4096
    reliability: 0.75
    pricing:
      input_per_million: 0.0
      output_per_million: 0.0
    metadata:
      notes: >-
        Free. Deliberately declares neither long_context nor high_reliability, so any task
        needing those escalates past it. reliability 0.75 means the balanced policy floor
        (0.82) already excludes it -- only economy mode will use it. Raise that only from
        measured evaluation evidence.

  # Tier 2 -- cheap cloud, used when the prompt is too large for tier 1.
  - name: cloud-flash-lite
    provider: google
    execution_classes:
      - light_reasoning
    capabilities:
      - semantic_reasoning
      - long_context
    context_window: 1048576
    reliability: 0.90
    pricing:
      input_per_million: 0.30
      output_per_million: 2.50

  # Tier 3 -- reached when the task declares high_reliability or deep_planning.
  - name: cloud-flash
    provider: google
    execution_classes:
      - light_reasoning
      - deep_reasoning
    capabilities:
      - semantic_reasoning
      - deep_planning
      - high_reliability
      - long_context
    context_window: 1048576
    reliability: 0.96
    pricing:
      input_per_million: 1.50
      output_per_million: 9.00
