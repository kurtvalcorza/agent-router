# Local reviewed catalog.
#
# Pricing is transcribed from Google's published Gemini API pricing page (paid
# tier, standard, TEXT input) on the pricing_as_of date. Audio input is priced
# separately and is not modelled here. Re-check before relying on cost routing.
#
# context_window values were read from the live Models API (input_token_limit),
# not from documentation.
#
# reliability values are LOCAL POLICY JUDGEMENTS, not provider facts. The values
# below are unreviewed starting points -- replace them with your own measured
# evaluation evidence before using this catalog for production routing.
#
# Model availability was probed against this project's key on 2026-08-23. Note
# that the Models API lists models the key cannot actually call: gemini-2.5-*
# returns 404 "no longer available to new users", and gemini-3.1-pro-preview
# returns 429 with free-tier limit 0. Add pro-tier models here only once the
# project has billing enabled.
version: "2026-08-23"
pricing_as_of: "2026-08-23"
pricing_source: "https://ai.google.dev/gemini-api/docs/pricing"
metadata:
  owner: "local-policy"
  reliability_review: "UNREVIEWED -- placeholder values, replace with measured evidence"
  availability_checked: "2026-08-23 by live generate_content probe, free tier"

aliases:
  fast: gemini-3.5-flash-lite
  strong: gemini-3.5-flash

models:
  - name: gemini-3.5-flash-lite
    provider: google
    execution_classes:
      - light_reasoning
    capabilities:
      - semantic_reasoning
      - long_context
    context_window: 1048576
    reliability: 0.90
    pricing:
      input_per_million: 0.30
      output_per_million: 2.50

  - name: gemini-3.5-flash
    provider: google
    execution_classes:
      - light_reasoning
      - deep_reasoning
    capabilities:
      - semantic_reasoning
      - deep_planning
      - high_reliability
      - long_context
    context_window: 1048576
    reliability: 0.96
    pricing:
      input_per_million: 1.50
      output_per_million: 9.00
